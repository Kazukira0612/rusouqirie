<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terima Kasih — rusouqirie</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    :root{
      --pink:#ec4899;
      --pink-light:#fbcfe8;
      --dark:#111827;
      --gray:#6b7280;
      --white:#ffffff;

      --font-display:'Cormorant Garamond', serif;
      --font-body:'Jost', sans-serif;
    }

    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
      position:relative;
      font-family:var(--font-body);
      background:url('images/wedding3.jpg') center/cover no-repeat;
    }

    body::before{
      content:'';
      position:absolute;
      inset:0;
      background:rgba(0,0,0,.65);
      backdrop-filter:blur(2px);
    }

    .container{
      position:relative;
      z-index:2;
      width:min(92%, 700px);
      background:rgba(255,255,255,.95);
      border-radius:32px;
      padding:4rem 3rem;
      text-align:center;
      box-shadow:0 25px 80px rgba(0,0,0,.35);

      animation:fadeUp 1s ease;
    }

    .icon{
      width:100px;
      height:100px;
      margin:0 auto 2rem;
      border-radius:50%;
      background:linear-gradient(135deg,var(--pink),#db2777);
      display:flex;
      align-items:center;
      justify-content:center;
      color:white;
      font-size:3rem;
      box-shadow:0 10px 40px rgba(236,72,153,.45);
    }

    .eyebrow{
      text-transform:uppercase;
      letter-spacing:.35rem;
      color:var(--pink);
      font-size:.75rem;
      font-weight:600;
      margin-bottom:1rem;
    }

    h1{
      font-family:var(--font-display);
      font-size:clamp(2.5rem,6vw,4.5rem);
      color:var(--dark);
      line-height:1.1;
      margin-bottom:1rem;
    }

    p{
      color:var(--gray);
      font-size:1.05rem;
      line-height:1.8;
      max-width:520px;
      margin:0 auto;
    }

    .highlight{
      color:var(--pink);
      font-weight:600;
    }

    .buttons{
      margin-top:2.5rem;
      display:flex;
      justify-content:center;
      flex-wrap:wrap;
      gap:1rem;
    }

    .btn{
      text-decoration:none;
      padding:14px 28px;
      border-radius:999px;
      font-weight:600;
      transition:all .25s ease;
      font-size:1rem;
    }

    .btn-primary{
      background:var(--pink);
      color:white;
      box-shadow:0 10px 30px rgba(236,72,153,.35);
    }

    .btn-primary:hover{
      background:#db2777;
      transform:translateY(-3px);
      box-shadow:0 16px 40px rgba(236,72,153,.45);
    }

    .btn-outline{
      border:1.5px solid #d1d5db;
      color:var(--dark);
      background:white;
    }

    .btn-outline:hover{
      background:#f9fafb;
      transform:translateY(-3px);
    }

    @keyframes fadeUp{
      from{
        opacity:0;
        transform:translateY(40px);
      }
      to{
        opacity:1;
        transform:none;
      }
    }

    @media(max-width:600px){

      .container{
        padding:3rem 1.5rem;
      }

      .buttons{
        flex-direction:column;
      }

      .btn{
        width:100%;
      }

    }
  </style>
</head>
<body>

  <div class="container">

    <div class="icon">
      ✓
    </div>

    <p class="eyebrow">Tempahan Berjaya</p>

    <h1>Terima Kasih!</h1>

    <p>
      Pertanyaan anda telah berjaya dihantar kepada
      <span class="highlight">rusouqirie Wedding Planner</span>.
      Kami akan menghubungi anda dalam masa 24 jam untuk
      perbincangan lanjut mengenai majlis impian anda.
    </p>

    <div class="buttons">

      <a href="index.html" class="btn btn-primary">
        ← Kembali Ke Laman Utama
      </a>

      <a href="tel:01176099076" class="btn btn-outline">
        📞 Hubungi Kami
      </a>

    </div>

  </div>

</body>
</html>
